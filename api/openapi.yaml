openapi: 3.1.0
info:
  title: Baqueano API
  version: 1.0.0
  summary: Superficie externa de ataque de organizaciones que autorizaron el análisis.
  description: |
    Contrato entre el backend (Go) y el panel (React). El alcance de cada organización se analiza si quien
    la cargó aceptó la declaración de responsabilidad, o si el dueño verificó el dominio en DNS (opcional). Los tipos de TypeScript del panel se generan
    desde este archivo (`npm run gen:api` en web/).

    Las operaciones que modifican datos exigen `X-Requested-With: baqueano` y, si el servidor se inició
    con token, `Authorization: Bearer <token>`.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:8080/api/v1

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Estado del servidor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Organizaciones con su último escaneo y su evolución.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
  /orgs:
    get:
      operationId: listOrgs
      responses:
        "200":
          description: Organizaciones.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrgSummary" } }
    post:
      operationId: createOrg
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrgRequest" }
      responses:
        "201":
          description: Organización creada. Cada dominio trae el registro TXT a publicar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
  /orgs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getOrg
      responses:
        "200":
          description: Organización con su historial de escaneos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDetail" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrg
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "204": { description: Borrada junto con sus escaneos. }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/domains:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: addDomain
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties: { domain: { type: string } }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/networks:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: addNetwork
      description: Suma una red propia (CIDR o IP pública, hasta un /20). Se analiza si hay declaración de responsabilidad.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network]
              properties: { network: { type: string } }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/attestation:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: attest
      description: Registra la declaración de responsabilidad sobre el alcance (queda en el historial de auditoría).
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttestationRequest" }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/verify:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: verifyOrg
      description: Verificación opcional. Consulta los registros TXT de cada dominio; si un registro se retiró, el dominio deja de estar verificado.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "200":
          description: Organización con el estado de verificación actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/scans:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: startScan
      description: Lanza un escaneo en segundo plano (puede tardar minutos). Consultar el avance en /jobs/{id}.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "202":
          description: Escaneo iniciado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /orgs/{id}/reassess:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: startReassess
      description: >
        Vuelve a evaluar el último escaneo con la inteligencia de vulnerabilidades actual, sin consultar la
        fuente de exposición (no gasta créditos). Genera un escaneo nuevo; consultar el avance en /jobs/{id}.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "202":
          description: Reevaluación iniciada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /orgs/{id}/contexts:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: saveContext
      description: Crea o actualiza (por id) el contexto de un grupo de activos.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetContext" }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/contexts/{cid}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: cid, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteContext
      description: Borra un contexto.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/rules:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: saveRule
      description: Crea o actualiza una regla de severidad.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeverityRule" }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/rules/{rid}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: rid, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteRule
      description: Borra una regla.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/findings/{fid}/state:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: fid, in: path, required: true, schema: { type: string } }
    post:
      operationId: setFindingState
      description: Cambia el estado de un hallazgo. Aceptar exige motivo, responsable y vencimiento.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StateChange" }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/alerts:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: saveAlert
      description: Crea o actualiza una alerta. Un destino enmascarado conserva el guardado.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Alert" }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/alerts/{aid}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: aid, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteAlert
      description: Borra una alerta.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/schedule:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: setSchedule
      description: Programa escaneos o reevaluaciones periódicas.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schedule" }
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/alerts/{aid}/test:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: aid, in: path, required: true, schema: { type: string } }
    post:
      operationId: testAlert
      description: Envía un aviso de prueba por el canal de la alerta.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "200":
          description: Enviado.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string } } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /intel:
    get:
      operationId: getIntel
      description: Estado de la base de inteligencia de vulnerabilidades y de cada fuente.
      responses:
        "200":
          description: Estado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntelStatus" }
  /intel/update:
    post:
      operationId: updateIntel
      description: Descarga el catálogo KEV y refresca EPSS de las CVE conocidas.
      security: [{ csrf: [] }, { csrf: [], bearer: [] }]
      responses:
        "200":
          description: Base actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntelStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /intel/cves/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^CVE-\\d{4}-\\d{4,}$" } }
    get:
      operationId: getCVE
      description: Lo que se sabe de una CVE (versiones afectadas por fuente, KEV, EPSS, SSVC). Si falta y hay conexión, se consulta.
      responses:
        "200":
          description: Datos de la CVE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CVEInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getJob
      responses:
        "200":
          description: Estado del escaneo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Error" }
  /snapshots/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getSnapshot
      responses:
        "200":
          description: Escaneo completo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/Error" }
  /snapshots/{id}/changes:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getChanges
      responses:
        "200":
          description: Diferencias con el escaneo anterior de la misma organización.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changes" }
        "404": { $ref: "#/components/responses/Error" }
  /snapshots/{id}/export:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: format, in: query, required: true, schema: { type: string, enum: [json, csv] } }
    get:
      operationId: exportSnapshot
      responses:
        "200":
          description: Escaneo en JSON, o hallazgos en CSV (con celdas protegidas contra inyección de fórmulas).
          content:
            application/json: { schema: { $ref: "#/components/schemas/Snapshot" } }
            text/csv: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    csrf: { type: apiKey, in: header, name: X-Requested-With, description: "Siempre `baqueano`." }
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties: { error: { type: string } }
  schemas:
    Severity: { type: string, enum: [critica, alta, media, baja, info] }
    Category: { type: string, enum: [servicio-expuesto, vulnerabilidad, tls, dns, higiene] }
    CountMap: { type: object, additionalProperties: { type: integer } }

    Health:
      type: object
      required: [status, version, exposure_source, auth_required, read_only]
      properties:
        status: { type: string }
        version: { type: string }
        exposure_source: { type: string, description: "shodan, internetdb, censys, none o demo; combinadas con + (shodan+censys)." }
        auth_required: { type: boolean }
        read_only: { type: boolean }
        intel: { type: boolean, description: Hay base de inteligencia de vulnerabilidades. }

    Domain:
      type: object
      required: [name, token]
      properties:
        name: { type: string }
        token: { type: string }
        verified_at: { type: string, format: date-time }
        networks: { type: array, items: { type: string } }
        last_check: { type: string, format: date-time }
        check_error: { type: string }
    Attestation:
      type: object
      required: [by, at, statement]
      properties:
        by: { type: string }
        at: { type: string, format: date-time }
        statement: { type: string }
    AuditEvent:
      type: object
      required: [at, action]
      properties:
        at: { type: string, format: date-time }
        action: { type: string }
        detail: { type: string }
    Organization:
      type: object
      required: [id, name, domains, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        domains: { type: array, items: { $ref: "#/components/schemas/Domain" } }
        networks: { type: array, items: { type: string }, description: Redes declaradas. }
        attestation: { $ref: "#/components/schemas/Attestation" }
        audit: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        created_at: { type: string, format: date-time }
        contexts: { type: array, items: { $ref: "#/components/schemas/AssetContext" } }
        rules: { type: array, items: { $ref: "#/components/schemas/SeverityRule" } }
        states: { type: object, additionalProperties: { $ref: "#/components/schemas/FindingState" }, description: Estado de cada hallazgo por su ID. }
        schedule: { $ref: "#/components/schemas/Schedule" }
        alerts: { type: array, items: { $ref: "#/components/schemas/Alert" }, description: "Los destinos de webhook, Slack y Teams se devuelven enmascarados." }
    AssetContext:
      type: object
      required: [match]
      properties:
        id: { type: string }
        match: { type: string, description: "Nombre, *.subdominio, IP o red." }
        environment: { type: string, enum: [produccion, pruebas, desarrollo, ""] }
        criticality: { type: string, enum: [alta, normal, baja, ""] }
        owner: { type: string }
        note: { type: string }
    SeverityRule:
      type: object
      required: [rule, severity, note]
      properties:
        id: { type: string }
        rule: { type: string, description: "Control (PX-RDP), familia (PX-*) o todos (*)." }
        match: { type: string }
        environment: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        note: { type: string }
    FindingState:
      type: object
      required: [status, at]
      properties:
        status: { type: string, enum: [abierto, en-curso, aceptado, falso-positivo] }
        note: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
        until: { type: string, format: date-time }
    StateChange:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [abierto, en-curso, aceptado, falso-positivo] }
        note: { type: string }
        by: { type: string }
        until: { type: string, description: "AAAA-MM-DD; obligatorio para aceptar (hasta un año)." }
    Schedule:
      type: object
      required: [enabled, hours, mode]
      properties:
        enabled: { type: boolean }
        hours: { type: integer, minimum: 6, maximum: 720 }
        mode: { type: string, enum: [escanear, reevaluar] }
        next_run: { type: string, format: date-time }
        last_run: { type: string, format: date-time }
        last_error: { type: string }
    Alert:
      type: object
      required: [name, channel, target, events, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        channel: { type: string, enum: [webhook, slack, teams, email, jira] }
        target: { type: string }
        events: { type: array, items: { type: string, enum: [hallazgo-nuevo, sube-severidad, servicio-nuevo, kev, resumen] } }
        min_severity: { type: string }
        rules: { type: array, items: { type: string } }
        enabled: { type: boolean }
        last_sent: { type: string, format: date-time }
        last_error: { type: string }
        tickets: { type: object, additionalProperties: { type: string } }
    Consensus:
      type: object
      required: [sources, services, all, single]
      properties:
        sources: { type: array, items: { type: string } }
        services: { type: integer }
        all: { type: integer }
        single: { type: integer }
    AttestationRequest:
      type: object
      required: [by, accepted]
      properties:
        by: { type: string, minLength: 3, maxLength: 120, description: Nombre de quien se hace responsable. }
        accepted: { type: boolean, description: Tiene que ser true. }
    CreateOrgRequest:
      type: object
      required: [name, domains]
      properties:
        name: { type: string, maxLength: 120 }
        domains: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        networks: { type: array, maxItems: 16, items: { type: string } }
        attestation: { $ref: "#/components/schemas/AttestationRequest" }

    SnapshotMeta:
      type: object
      required: [id, org_id, org_name, started_at, finished_at, score, assets, ips, services, findings, by_severity]
      properties:
        id: { type: string }
        org_id: { type: string }
        org_name: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        score: { type: integer, minimum: 0, maximum: 100 }
        assets: { type: integer }
        ips: { type: integer }
        services: { type: integer }
        findings: { type: integer }
        by_severity: { $ref: "#/components/schemas/CountMap" }
    OrgSummary:
      allOf:
        - { $ref: "#/components/schemas/Organization" }
        - type: object
          required: [trend]
          properties:
            latest: { $ref: "#/components/schemas/SnapshotMeta" }
            trend: { type: array, items: { $ref: "#/components/schemas/SnapshotMeta" } }
    OrgDetail:
      allOf:
        - { $ref: "#/components/schemas/OrgSummary" }
        - type: object
          required: [snapshots]
          properties:
            snapshots: { type: array, items: { $ref: "#/components/schemas/SnapshotMeta" } }
    Overview:
      type: object
      required: [orgs, score, assets, services, findings, by_severity]
      properties:
        orgs: { type: array, items: { $ref: "#/components/schemas/OrgSummary" } }
        score: { type: integer }
        assets: { type: integer }
        services: { type: integer }
        findings: { type: integer }
        by_severity: { $ref: "#/components/schemas/CountMap" }

    Asset:
      type: object
      required: [sources, resolves]
      properties:
        hostname: { type: string }
        ips: { type: array, items: { type: string } }
        cname: { type: string }
        sources: { type: array, items: { type: string } }
        resolves: { type: boolean }
        third_party: { type: string, description: Proveedor (CDN, SaaS); sus IP no se consultan. }
    Vuln:
      type: object
      required: [cve, verified]
      properties:
        cve: { type: string }
        cvss: { type: number }
        epss: { type: number }
        kev: { type: boolean }
        verified: { type: boolean, description: "La fuente la confirmó con una prueba (no solo por la versión)." }
        summary: { type: string }
        origin: { type: string, description: "Quién la propuso: shodan | internetdb | baqueano (encontrada por el motor)." }
        confidence: { $ref: "#/components/schemas/Confidence" }
        reason: { type: string, description: Por qué esa confianza. }
        fixed_in: { type: string, description: Primera versión corregida en la rama del servicio. }
        sources: { type: array, items: { type: string } }
        priority: { type: string, enum: [P1, P2, P3, P4], description: "P1 hoy · P2 esta semana · P3 este mes · P4 planificar." }
        priority_reason: { type: string }
        epss_percentile: { type: number }
        kev_due: { type: string }
        ransomware: { type: boolean }
        ssvc: { $ref: "#/components/schemas/SSVC" }
        cwe: { type: [array, "null"], items: { type: string } }
        published: { type: string }
    Confidence:
      type: string
      enum: [confirmada, probable, por-confirmar, improbable, descartada]
    SSVC:
      type: object
      required: [exploitation, automatable, technical_impact]
      properties:
        exploitation: { type: string }
        automatable: { type: string }
        technical_impact: { type: string }
    EOL:
      type: object
      required: [product, cycle, source]
      properties:
        product: { type: string }
        cycle: { type: string }
        since: { type: string }
        latest: { type: string }
        source: { type: string }
    Cert:
      type: object
      required: [not_after]
      properties:
        subject: { type: string }
        issuer: { type: string }
        not_after: { type: string, format: date-time }
        self_signed: { type: boolean }
        expired: { type: boolean }
        tls_versions: { type: array, items: { type: string } }
    Service:
      type: object
      required: [ip, port, transport, seen_at, source]
      properties:
        ip: { type: string }
        port: { type: integer }
        transport: { type: string }
        product: { type: string }
        version: { type: string }
        module: { type: string }
        http_title: { type: string }
        tags: { type: array, items: { type: string } }
        cpes: { type: array, items: { type: string } }
        vulns: { type: array, items: { $ref: "#/components/schemas/Vuln" } }
        dismissed: { type: array, items: { $ref: "#/components/schemas/Vuln" }, description: CVE propuestas por la fuente que el motor descartó, con el motivo. }
        eol: { $ref: "#/components/schemas/EOL" }
        banner: { type: string }
        cert: { $ref: "#/components/schemas/Cert" }
        hostnames: { type: array, items: { type: string } }
        org: { type: string }
        country: { type: string }
        seen_at: { type: string, format: date-time }
        seen_by: { type: array, items: { type: string } }
        source: { type: string }
    Finding:
      type: object
      required: [id, rule, category, severity, title, detail, recommendation, asset]
      properties:
        id: { type: string }
        rule: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        severity: { $ref: "#/components/schemas/Severity" }
        title: { type: string }
        detail: { type: string }
        recommendation: { type: string }
        asset: { type: string }
        evidence: { type: array, items: { type: string } }
        cve: { type: string }
        vuln: { $ref: "#/components/schemas/Vuln" }
        base_severity: { type: string, description: Severidad antes del contexto y las reglas de la organización. }
        adjustments: { type: array, items: { type: string } }
        environment: { type: string }
        criticality: { type: string }
        owner: { type: string }
        state: { $ref: "#/components/schemas/FindingState" }
    Snapshot:
      type: object
      required: [id, org_id, org_name, started_at, finished_at, domains, networks, authorization, assets, services, findings, sources, score]
      properties:
        id: { type: string }
        org_id: { type: string }
        org_name: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        domains: { type: array, items: { type: string } }
        networks: { type: [array, "null"], items: { type: string } }
        authorization: { type: [array, "null"], items: { type: string }, description: Con qué autorización se analizó el alcance. }
        assets: { type: [array, "null"], items: { $ref: "#/components/schemas/Asset" } }
        services: { type: [array, "null"], items: { $ref: "#/components/schemas/Service" } }
        findings: { type: [array, "null"], items: { $ref: "#/components/schemas/Finding" } }
        sources: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
        consensus: { $ref: "#/components/schemas/Consensus" }
        score: { type: integer }
    Changes:
      type: object
      required: [new_services, closed_services, new_findings, resolved_findings, severity_changes, new_assets, gone_assets]
      properties:
        previous_id: { type: string }
        new_services: { type: array, items: { $ref: "#/components/schemas/Service" } }
        closed_services: { type: array, items: { $ref: "#/components/schemas/Service" } }
        new_findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        resolved_findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        severity_changes:
          type: array
          items:
            type: object
            required: [finding, before, up]
            properties:
              finding: { $ref: "#/components/schemas/Finding" }
              before: { $ref: "#/components/schemas/Severity" }
              up: { type: boolean }
        new_assets: { type: array, items: { type: string } }
        gone_assets: { type: array, items: { type: string } }

    IntelStatus:
      type: object
      required: [online, nvd_key, records, sources]
      properties:
        online: { type: boolean }
        nvd_key: { type: boolean }
        kev_catalog: { type: string }
        records: { type: integer }
        sources:
          type: array
          items:
            type: object
            required: [id, name, description, items]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              items: { type: integer }
              updated: { type: string, format: date-time }
              error: { type: string }
    Range:
      type: object
      properties:
        exact: { type: string }
        start: { type: string }
        start_inc: { type: boolean }
        end: { type: string }
        end_inc: { type: boolean }
        prefix: { type: string }
    CVEInfo:
      type: object
      properties:
        record:
          type: object
          required: [cve]
          properties:
            cve: { type: string }
            summary: { type: string }
            published: { type: string }
            cvss: { type: number }
            vector: { type: string }
            cwe: { type: [array, "null"], items: { type: string } }
            ssvc: { $ref: "#/components/schemas/SSVC" }
            sources: { type: array, items: { type: string } }
            rejected: { type: boolean }
            affected:
              type: array
              items:
                type: object
                required: [name, quality, source]
                properties:
                  products: { type: array, items: { type: string } }
                  name: { type: string }
                  ranges: { type: array, items: { $ref: "#/components/schemas/Range" } }
                  unaffected: { type: array, items: { $ref: "#/components/schemas/Range" } }
                  all_versions: { type: boolean }
                  not_affected: { type: boolean }
                  quality: { type: string, enum: [estructurado, texto, sin-versiones] }
                  source: { type: string, enum: [nvd, cve, cisa-adp] }
        kev:
          type: object
          required: [added, due]
          properties:
            vendor: { type: string }
            product: { type: string }
            name: { type: string }
            added: { type: string }
            due: { type: string }
            action: { type: string }
            ransomware: { type: boolean }
        epss:
          type: object
          required: [score, percentile]
          properties:
            score: { type: number }
            percentile: { type: number }
            date: { type: string }
            fetched: { type: string, format: date-time }
    Job:
      type: object
      required: [id, org_id, status, message, started_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        status: { type: string, enum: [running, done, error] }
        message: { type: string }
        snapshot_id: { type: string }
        error: { type: string }
        started_at: { type: string, format: date-time }
